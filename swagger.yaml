openapi: 3.0.0

info:
  title: Survey Analysis API Documentation
  description: Explore the API endpoints for interacting with the application, including data retrieval and updates.
  version: 1.0.0

servers:
  - url: https://survey-analysis-backend.onrender.com/api

paths:

  /learning-methods:
    get:
      summary: Get all learning methods
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningMethod'
    post:
      summary: Create a new learning method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningMethod'
      responses:
        '201':
          description: Learning method created

  /learning-methods/{id}:
    get:
      summary: Get a learning method by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningMethod'
        '404':
          description: Learning method not found
    put:
      summary: Update a learning method
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningMethod'
      responses:
        '200':
          description: Learning method updated
        '404':
          description: Learning method not found
    delete:
      summary: Delete a learning method
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Learning method deleted
        '404':
          description: Learning method not found

  /technologies-adopted:
    get:
      summary: Get all technologies adopted
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnologyAdopted'
    post:
      summary: Create a new technology adopted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyAdopted'
      responses:
        '201':
          description: Technology adopted created

  /technologies-adopted/{id}:
    get:
      summary: Get a technology adopted by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnologyAdopted'
        '404':
          description: Technology adopted not found
    put:
      summary: Update a technology adopted
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyAdopted'
      responses:
        '200':
          description: Technology adopted updated
        '404':
          description: Technology adopted not found
    delete:
      summary: Delete a technology adopted
      description: Delete a technology adopted record from the system by its ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Technology adopted deleted
        '404':
          description: Technology adopted not found

components:
  schemas:
    LearningMethod:
      type: object
      required:
        - name
        - semester
        - year
        - methods
      properties:
        id:
          type: string
        name:
          type: string
        semester:
          type: string
        year:
          type: number
        methods:
          type: array
          items:
            $ref: '#/components/schemas/Method'
    Method:
      type: object
      required:
        - method
        - scores
      properties:
        method:
          type: string
        scores:
          type: array
          items:
            type: number
          minItems: 5
          maxItems: 5
    TechnologyAdopted:
      type: object
      required:
        - name
        - semester
        - year
        - techniques
      properties:
        id:
          type: string
        name:
          type: string
        semester:
          type: string
        year:
          type: number
        techniques:
          type: array
          items:
            $ref: '#/components/schemas/Technique'
    Technique:
      type: object
      required:
        - technique
        - counts
      properties:
        technique:
          type: string
        counts:
          type: number
          minimum: 0